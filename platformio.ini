; Solar System — kinetic light installation
; Two firmwares built from one project:
;   solar_sun_esp32     -> src/sun_main.cpp     (ESP32 WROOM-32, master + web + LEDs)
;   solar_planet_esp32c3 -> src/planet_main.cpp (ESP32-C3 Super Mini, x8 identical carts)

[platformio]
; Build BOTH firmwares as the default set. This keeps the active-environment
; switcher from changing the build signature, so switching between sun/planet in
; the PIO extension no longer prunes the other env's .pio/build/<env> folder.
; Note: use the per-environment PROJECT TASKS entries (General > Upload / Monitor)
; for board-specific actions — the toolbar Upload/Monitor buttons act on the whole
; default set and will try both boards.
default_envs = solar_sun_esp32, solar_planet_esp32c3

[common]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200

[env:solar_sun_esp32]
extends = common
board = esp32dev
build_src_filter = +<sun_main.cpp>
board_build.filesystem = littlefs
build_flags = -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps =
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ayushsharma82/ElegantOTA @ ^3.1.6
upload_port = COM17
monitor_port = COM17

[env:solar_planet_esp32c3]
extends = common
board = esp32-c3-devkitm-1
build_src_filter = +<planet_main.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    fastled/FastLED @ ^3.7.0
upload_port = COM24
monitor_port = COM24

; Standalone bench test rig for the two wheel motors (not part of the show firmware).
; Browser UI to drive both TMC2209s in real time (microsteps/current/dir/speed/accel/decel,
; stealthChop vs spreadCycle), read live driver status (disconnected/stuck/open-load/over-temp),
; and verify over-UART writes actually landed (IFCNT + register read-back). Uses FastAccelStepper
; (hardware-timed STEP pulses, so both motors share one clock and stay synchronized).
[env:esp32c3_stepper_test]
extends = common
board = esp32-c3-devkitm-1
build_src_filter = +<stepper_test_main.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    gin66/FastAccelStepper @ ^0.31.6
    teemuatlut/TMCStepper @ ^0.7.3
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
upload_port = COM24
monitor_port = COM24
