; Solar System — kinetic light installation
; Two firmwares built from one project:
;   solar_sun_esp32     -> src/sun_main.cpp     (ESP32 WROOM-32, master + web + LEDs)
;   solar_planet_esp32c3 -> src/planet_main.cpp (ESP32-C3 Super Mini, x8 identical carts)

[common]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200

[env:solar_sun_esp32]
extends = common
board = esp32dev
build_src_filter = +<sun_main.cpp>
board_build.filesystem = littlefs
build_flags = -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps =
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ayushsharma82/ElegantOTA @ ^3.1.6
upload_port = COM17
monitor_port = COM17

[env:solar_planet_esp32c3]
extends = common
board = esp32-c3-devkitm-1
build_src_filter = +<planet_main.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    gin66/FastAccelStepper @ ^0.31.6
    teemuatlut/TMCStepper @ ^0.7.3
upload_port = COM19
monitor_port = COM19
